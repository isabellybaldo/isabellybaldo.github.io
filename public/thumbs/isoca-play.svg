<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- a tile with a rose heart on its back, and a small sudoku grid -->
  <g fill="#2b2b3a">
    <rect x="2" y="1" width="12" height="1"/>
    <rect x="2" y="14" width="12" height="1"/>
    <rect x="1" y="2" width="1" height="12"/>
    <rect x="14" y="2" width="1" height="12"/>
    <rect x="9" y="8" width="5" height="1"/>
    <rect x="9" y="10" width="5" height="1"/>
    <rect x="9" y="12" width="5" height="1"/>
    <rect x="9" y="8" width="1" height="5"/>
    <rect x="11" y="8" width="1" height="5"/>
    <rect x="13" y="8" width="1" height="5"/>
  </g>
  <g fill="#ff8fab">
    <rect x="3" y="3" width="2" height="2"/>
    <rect x="6" y="3" width="2" height="2"/>
    <rect x="3" y="4" width="5" height="2"/>
    <rect x="4" y="6" width="3" height="1"/>
    <rect x="5" y="7" width="1" height="1"/>
  </g>
  <g fill="#7ee2b8">
